[project]
name = "weave-workspace"
version = "0.1.0"
description = "Weave monorepo workspace root"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["weave_coordinator", "weave_sdk"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["coordinator/tests", "sdk/python/tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
