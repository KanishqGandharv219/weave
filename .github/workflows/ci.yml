name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python (Coordinator + SDK) ─────────
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coordinator deps
        run: |
          cd coordinator
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check coordinator/src/ sdk/python/

      - name: Type check (mypy)
        run: mypy coordinator/src/weave_coordinator/ --ignore-missing-imports

      - name: Test (pytest)
        run: pytest coordinator/tests/ -v --tb=short

  # ── Rust (Daemon) ──────────────────────
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ── Docker ─────────────────────────────
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build coordinator image
        run: docker build -t weave-coordinator:ci ./coordinator
